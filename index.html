<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DINTEL Café · Bar</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080808;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .contenedor {
            max-width: 500px;
            margin: auto;
        }

        /* LOGO DINTEL */

        .logo-dintel {
            width: 390px;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 5px auto 15px;

            filter:
                drop-shadow(0 0 8px rgba(220, 30, 45, 0.35))
                drop-shadow(0 0 22px rgba(180, 20, 30, 0.18));
        }

        /* PRESENTACIÓN */

        .bienvenidos {
            font-size: 24px;
            color: #ddd;
            margin-top: 5px;
            margin-bottom: 8px;
        }

        .frase {
            font-size: 13px;
            letter-spacing: 4px;
            color: #888;
            margin-bottom: 25px;
        }

        .linea {
            width: 90px;
            height: 4px;
            background: #d92332;
            margin: 0 auto 30px;

            box-shadow:
                0 0 8px rgba(217, 35, 50, 0.7);
        }

        /* BOTONES */

        .boton {
            display: flex;
            align-items: center;
            justify-content: space-between;

            width: 100%;
            min-height: 78px;

            margin: 14px 0;
            padding: 12px 20px;

            border-radius: 20px;

            background: #151515;
            border: 2px solid #333;

            color: white;
            text-decoration: none;

            font-size: 19px;
            font-weight: bold;

            transition: all 0.2s ease;
        }

        .boton:hover {
            transform: translateY(-2px);
            border-color: #555;
        }

        /* MENU */

        .boton.menu {
            background:
                linear-gradient(
                    90deg,
                    #35090d,
                    #160909
                );

            border-color: #a51d29;

            box-shadow:
                0 0 15px rgba(180, 20, 30, 0.12);
        }

        /* ICONOS */

        .icono {
            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 25px;

            flex-shrink: 0;
        }

        .menu .icono {
            background: #c92130;
        }

        .instagram .icono {
            background: #e1306c;
        }

        .whatsapp .icono {
            background: #16c765;
        }

        .ubicacion .icono {
            background: #e52d3d;
        }

        .mercadopago .icono {
            background: #168de2;
        }

        .texto {
            flex: 1;
            text-align: left;
            margin-left: 18px;
        }

        .flecha {
            font-size: 35px;
            font-weight: normal;
        }

        /* PIE */

        .separador {
            margin-top: 65px;
            border-top: 1px solid #333;
        }

        .credito {
            margin-top: 25px;
            color: #777;
            font-size: 11px;
            letter-spacing: 3px;
        }

        .logo-on {
            width: 230px;
            max-width: 70%;
            height: auto;
            margin: 12px auto 5px;
            display: block;
        }

        /* CELULAR */

        @media (max-width: 500px) {

            body {
                padding: 20px 15px;
            }

            .logo-dintel {
                width: 360px;
            }

            .bienvenidos {
                font-size: 22px;
            }

            .boton {
                min-height: 72px;
                font-size: 17px;
                padding: 10px 18px;
            }

            .icono {
                width: 48px;
                height: 48px;
                font-size: 22px;
            }

            .flecha {
                font-size: 30px;
            }

            .logo-on {
                width: 210px;
            }
        }

    </style>

</head>

<body>

<div class="contenedor">

    <!-- LOGO DINTEL -->

    <img
        class="logo-dintel"
        src="logo_dintel_transparente.png"
        alt="DINTEL Café Bar"
    >


    <!-- PRESENTACIÓN -->

    <div class="bienvenidos">
        Bienvenidos
    </div>

    <div class="frase">
        BUEN CAFÉ, MEJORES MOMENTOS
    </div>

    <div class="linea"></div>


    <!-- MENÚ -->

    <a class="boton menu" href="menu.html">

        <div class="icono">🍔</div>

        <div class="texto">
            Ver menú
        </div>

        <div class="flecha">
            ›
        </div>

    </a>


    <!-- INSTAGRAM -->

    <a
        class="boton instagram"
        href="https://www.instagram.com/dintelcafebar/"
        target="_blank"
    >

        <div class="icono">◎</div>

        <div class="texto">
            Instagram
        </div>

        <div class="flecha">
            ›
        </div>

    </a>


    <!-- WHATSAPP -->

    <a
        class="boton whatsapp"
        href="https://wa.me/5493364196254"
        target="_blank"
    >

        <div class="icono">☏</div>

        <div class="texto">
            WhatsApp
        </div>

        <div class="flecha">
            ›
        </div>

    </a>


    <!-- UBICACIÓN -->

    <a
        class="boton ubicacion"
        href="#"
    >

        <div class="icono">●</div>

        <div class="texto">
            Cómo llegar
        </div>

        <div class="flecha">
            ›
        </div>

    </a>


    <!-- MERCADO PAGO -->

    <a
        class="boton mercadopago"
        href="#"
    >

        <div class="icono">▣</div>

        <div class="texto">
            Pagar con Mercado Pago
        </div>

        <div class="flecha">
            ›
        </div>

    </a>


    <!-- PIE ON -->

    <div class="separador"></div>

    <div class="credito">
        UNA SOLUCIÓN DE
    </div>

    <img
        class="logo-on"
        src="logo_on_transparente.png"
        alt="ON Soporte Informático"
    >

</div>

</body>

</html>
